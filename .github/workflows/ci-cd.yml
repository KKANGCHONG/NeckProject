name: TurtleFlow 🐢 (Full-stack CI/CD)

on:
  push:
    branches: [ deploy ]
  pull_request:
    branches: [ deploy ]

jobs:
  # =============================
  # 1️⃣ BUILD & TEST
  # =============================
  build:
    runs-on: ubuntu-latest

    steps:
      # --- 공통: 깃허브 체크아웃 ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 백엔드 (Flask) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          cd camera
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint backend (syntax check)
        run: |
          source camera/venv/bin/activate
          python -m compileall camera/api_server.py

      # --- 프론트엔드 (Vite React) ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd front
          npm ci

      - name: Build frontend
        run: |
          cd front
          npm run build

  # =============================
  # 2️⃣ DEPLOY TO RENDER
  # =============================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # --- 백엔드 배포 ---
      - name: Trigger Render Backend Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: srv-d43qn1be5dus73a8l3g0
        run: |
          echo "🚀 Triggering Render deploy for Backend..."
          curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            https://api.render.com/v1/services/$RENDER_BACKEND_SERVICE_ID/deploys
          echo "✅ Backend deploy triggered! Check https://neckproject.onrender.com"

      # --- 프론트엔드 배포 ---
      - name: Trigger Render Frontend Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_FRONTEND_SERVICE_ID: srv-d43rdge3jp1c73aio3a0
        run: |
          echo "🚀 Triggering Render deploy for Frontend..."
          curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            https://api.render.com/v1/services/$RENDER_FRONTEND_SERVICE_ID/deploys
          echo "✅ Frontend deploy triggered! Check https://neckproject-fronted.onrender.com"
